name: fuzzingserver
services:
  fuzzingserver:
    image: crossbario/autobahn-testsuite
    volumes:
      - ./config:/config
      - ./reports:/reports
    ports:
      - 9001:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001"]
      interval: 1s
      timeout: 1s
      retries: 5
      start_period: 5s
      start_interval: 1s
